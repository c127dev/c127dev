    <g style="animation:o1 18s linear infinite"><text x="22" y="55" class="out" textLength="388.8" lengthAdjust="spacingAndGlyphs">c127 - drivers, firmware, OpenWrt board bring-up</text></g>
  </g>
  <g style="animation:ln2 18s linear infinite">
    <text x="22" y="89" class="host" textLength="121.5" lengthAdjust="spacingAndGlyphs">c127@github.com</text>
    <text x="143.5" y="89" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">:</text>
    <text x="151.6" y="89" class="arg" textLength="8.1" lengthAdjust="spacingAndGlyphs">~</text>
    <text x="159.7" y="89" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">$</text>
    <g style="animation:ty2 18s steps(9,end) infinite"><text x="175.9" y="89" class="plain" textLength="72.9" lengthAdjust="spacingAndGlyphs">ls trees/</text></g>
    <g style="animation:cr2 18s linear infinite"><g style="animation:cx2 18s steps(9,end) infinite"><rect x="175.9" y="78" width="8.1" height="15.5" class="caret" style="animation:blink 1s steps(1,end) infinite"/></g></g>
    <g style="animation:o2 18s linear infinite"><text x="22" y="110" class="out" textLength="421.2" lengthAdjust="spacingAndGlyphs">linux/   u-boot/   openwrt/   armbian/   containers/</text></g>
  </g>
  <g style="animation:ln3 18s linear infinite">
    <text x="22" y="144" class="host" textLength="121.5" lengthAdjust="spacingAndGlyphs">c127@github.com</text>
    <text x="143.5" y="144" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">:</text>
    <text x="151.6" y="144" class="arg" textLength="8.1" lengthAdjust="spacingAndGlyphs">~</text>
    <text x="159.7" y="144" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">$</text>
    <g style="animation:ty3 18s steps(14,end) infinite"><text x="175.9" y="144" class="plain" textLength="113.4" lengthAdjust="spacingAndGlyphs">cat trees/.now</text></g>
    <g style="animation:cr3 18s linear infinite"><g style="animation:cx3 18s steps(14,end) infinite"><rect x="175.9" y="133" width="8.1" height="15.5" class="caret" style="animation:blink 1s steps(1,end) infinite"/></g></g>
    <g style="animation:o3 18s linear infinite"><text x="22" y="165" class="out" textLength="372.6" lengthAdjust="spacingAndGlyphs">qualcommax: add support for Mercusys MR80X v2.</text></g>
  </g>
  <g style="animation:ln4 18s linear infinite">
    <text x="22" y="199" class="host" textLength="121.5" lengthAdjust="spacingAndGlyphs">c127@github.com</text>
    <text x="143.5" y="199" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">:</text>
    <text x="151.6" y="199" class="arg" textLength="8.1" lengthAdjust="spacingAndGlyphs">~</text>
    <text x="159.7" y="199" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">$</text>
    <g style="animation:ty4 18s steps(29,end) infinite"><text x="175.9" y="199" class="plain" textLength="234.9" lengthAdjust="spacingAndGlyphs">xdg-open https://www.c127.dev</text></g>
    <g style="animation:cr4 18s linear infinite"><g style="animation:cx4 18s steps(29,end) infinite"><rect x="175.9" y="188" width="8.1" height="15.5" class="caret" style="animation:blink 1s steps(1,end) infinite"/></g></g>
    <g style="animation:o4 18s linear infinite"><text x="22" y="220" class="out" textLength="226.8" lengthAdjust="spacingAndGlyphs">opening https://www.c127.dev</text></g>
  </g>
  <g style="animation:ln5 18s linear infinite">
    <text x="22" y="254" class="host" textLength="121.5" lengthAdjust="spacingAndGlyphs">c127@github.com</text>
    <text x="143.5" y="254" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">:</text>
    <text x="151.6" y="254" class="arg" textLength="8.1" lengthAdjust="spacingAndGlyphs">~</text>
    <text x="159.7" y="254" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">$</text>
    <g style="animation:ty5 18s steps(5,end) infinite"><text x="175.9" y="254" class="plain" textLength="40.5" lengthAdjust="spacingAndGlyphs">clear</text></g>
    <g style="animation:cr5 18s linear infinite"><g style="animation:cx5 18s steps(5,end) infinite"><rect x="175.9" y="243" width="8.1" height="15.5" class="caret" style="animation:blink 1s steps(1,end) infinite"/></g></g>
