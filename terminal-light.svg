@keyframes o2{0%,22.209999999999997%{opacity:0}22.22%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ln3{0%,26.66%{opacity:0}26.67%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ty3{0%,26.67%{clip-path:inset(0 100% 0 0)}36.67%,84.44%{clip-path:inset(0 0 0 0)}84.45%,100%{clip-path:inset(0 100% 0 0)}}
@keyframes cx3{0%,26.67%{transform:translateX(0)}36.67%,84.44%{transform:translateX(113.4px)}84.45%,100%{transform:translateX(0)}}
@keyframes cr3{0%,26.66%{opacity:0}26.67%,37.77%{opacity:1}37.78%,100%{opacity:0}}
@keyframes o3{0%,37.77%{opacity:0}37.78%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ln4{0%,42.21%{opacity:0}42.22%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ty4{0%,42.22%{clip-path:inset(0 100% 0 0)}58.89%,84.44%{clip-path:inset(0 0 0 0)}84.45%,100%{clip-path:inset(0 100% 0 0)}}
@keyframes cx4{0%,42.22%{transform:translateX(0)}58.89%,84.44%{transform:translateX(234.9px)}84.45%,100%{transform:translateX(0)}}
@keyframes cr4{0%,42.21%{opacity:0}42.22%,59.99%{opacity:1}60%,100%{opacity:0}}
@keyframes o4{0%,59.99%{opacity:0}60%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ln5{0%,64.42999999999999%{opacity:0}64.44%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ty5{0%,76.67%{clip-path:inset(0 100% 0 0)}81.11%,84.44%{clip-path:inset(0 0 0 0)}84.45%,100%{clip-path:inset(0 100% 0 0)}}
@keyframes cx5{0%,76.67%{transform:translateX(0)}81.11%,84.44%{transform:translateX(40.5px)}84.45%,100%{transform:translateX(0)}}
@keyframes cr5{0%,64.42999999999999%{opacity:0}64.44%,84.42999999999999%{opacity:1}84.44%,100%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="879" height="296" rx="6" ry="6" fill="var(--code)" stroke="var(--line)"/>
  <g>
    <text x="22" y="34" class="host" textLength="121.5" lengthAdjust="spacingAndGlyphs">c127@github.com</text>
    <text x="143.5" y="34" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">:</text>
    <text x="151.6" y="34" class="arg" textLength="8.1" lengthAdjust="spacingAndGlyphs">~</text>
    <text x="159.7" y="34" class="plain" textLength="8.1" lengthAdjust="spacingAndGlyphs">$</text>
    <g style="animation:ty1 18s steps(6,end) infinite"><text x="175.9" y="34" class="plain" textLength="48.6" lengthAdjust="spacingAndGlyphs">whoami</text></g>
