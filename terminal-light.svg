<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 297" width="880" height="297" role="img" aria-label="Terminal session: whoami, ls trees/, cat trees/.now, xdg-open https://www.c127.dev">
<style>
svg{--code:#f6f8fa;--line:#d1d9e0;--fg:#1f2328;--muted:#59636e;--prompt:#1a7f37;--arg:#8250df}
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
.host{fill:var(--prompt)}
.arg{fill:var(--arg)}
.plain{fill:var(--fg)}
.out{fill:var(--muted)}
.caret{fill:var(--fg)}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ty1{0%,4.44%{clip-path:inset(0 100% 0 0)}9.44%,84.44%{clip-path:inset(0 0 0 0)}84.45%,100%{clip-path:inset(0 100% 0 0)}}
@keyframes cx1{0%,4.44%{transform:translateX(0)}9.44%,84.44%{transform:translateX(48.6px)}84.45%,100%{transform:translateX(0)}}
@keyframes cr1{0%,10.55%{opacity:1}10.56%,84.44%{opacity:0}84.45%,100%{opacity:1}}
@keyframes o1{0%,10.55%{opacity:0}10.56%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ln2{0%,14.43%{opacity:0}14.44%,84.44%{opacity:1}84.45%,100%{opacity:0}}
@keyframes ty2{0%,14.44%{clip-path:inset(0 100% 0 0)}21.11%,84.44%{clip-path:inset(0 0 0 0)}84.45%,100%{clip-path:inset(0 100% 0 0)}}
@keyframes cx2{0%,14.44%{transform:translateX(0)}21.11%,84.44%{transform:translateX(72.9px)}84.45%,100%{transform:translateX(0)}}
